server {
    listen 80;
    server_name waymate.example.com;

    root /var/www/waymate/frontend/dist;
    index index.html;
    client_max_body_size 12m;

    # Laravel API
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/waymate/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/waymate/backend/public;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/waymate/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/waymate/backend/public;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Public avatars only. Verification and vehicle documents stay private.
    location /storage/ {
        alias /var/www/waymate/backend/storage/app/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Hashed Vite assets
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
